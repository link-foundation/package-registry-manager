# Builds the browser-free discovery modules of rust/src alone, so their tests
# can run where linking browser-commander (chromiumoxide_cdp) exceeds memory.
[package]
name = "package-registry-manager"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"

[[test]]
name = "parity"
path = "tests/parity.rs"
