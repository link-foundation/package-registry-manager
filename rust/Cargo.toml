[package]
name = "package-registry-manager"
version = "0.22.8"
edition = "2021"
description = "Inspect repositories and guide secure package-registry setup"
readme = "README.md"
license = "Unlicense"
keywords = ["registry", "publishing", "automation", "cli"]
categories = ["development-tools", "command-line-utilities"]
repository = "https://github.com/link-foundation/package-registry-manager"
documentation = "https://github.com/link-foundation/package-registry-manager#readme"
rust-version = "1.85"

# Narrow allowlist of files shipped in the published `.crate` archive.
# Keeping this list tight prevents docs, case studies, generated CI artifacts,
# changelog fragments, and experiments from silently inflating the release
# archive past the crates.io 10 MiB upload limit. See issue #58.
include = [
    "/src/**/*.rs",
    "/src/**/*.json",
    "/examples/**/*.rs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[lib]
name = "package_registry_manager"
path = "src/lib.rs"

[[bin]]
name = "package-registry-manager"
path = "src/main.rs"

[dependencies]
lino-arguments = "0.5.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
browser-commander = "0.19.0"
command-stream = "1.5.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1.6"

[dev-dependencies]
serde_json = "1.0.151"
walkdir = "2.5.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
