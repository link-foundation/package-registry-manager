name: Publish container image
on: workflow_dispatch
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            docker.io/acme/widgets:latest
            ghcr.io/acme/polyglot:latest
